name: Canary (latest dependencies)

# Does the newest strands-agents / ruff / pytest still work with this repository? The normal CI
# installs what pyproject.toml allows (upper bounds on those three); this job lifts those bounds
# and runs the Linux suite once a week, so a new SDK release is noticed on a Monday morning
# instead of when somebody opens an unrelated PR (#673, the strands-agents 1.64 case in #672).
# strands-agents-tools keeps its audited bound on purpose (see pyproject.toml).
# A red run here means: add an adaptation or a contract test, then raise the bound in pyproject.toml.

on:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC = Monday 03:00 JST
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_CONFIG_FILE: ${{ github.workspace }}/.no-aws/config
  AWS_SHARED_CREDENTIALS_FILE: ${{ github.workspace }}/.no-aws/credentials
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  canary:
    name: ubuntu-latest / Python 3.11 / newest strands-agents, ruff, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lift the upper bounds of strands-agents, ruff and pytest
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          # "name>=low,<high" -> "name>=low"; strands-agents-tools is not matched on purpose.
          lifted = re.sub(
              r'"((?:strands-agents(?:\[[a-z]+\])?|ruff|pytest)>=[0-9.]+),<[0-9.]+"', r'"\1"', text
          )
          assert lifted != text, "no upper bound found to lift: update this step"
          path.write_text(lifted, encoding="utf-8")
          PY

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Versions under test
        run: |
          {
            echo "### Versions under test"
            python -m pip list --format=freeze | grep -iE '^(strands-agents|strands-agents-tools|ruff|pytest)=='
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ dashboard/test_multimodal.py
